name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê a versão do campo packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Os testes rodam o ELF do Squads v4 da mainnet no LiteSVM, sem rede.
      - run: pnpm test
      - name: Build do webapp (devnet)
        run: VITE_CLUSTER=devnet VITE_RPC_URL=/rpc pnpm --filter @duplachave/approval-web build
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true # bigint-buffer (via @sqds/multisig) não tem versão corrigida
