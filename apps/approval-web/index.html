<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0D10">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Custódia 2 de 3 na Solana: sua carteira + a biometria do seu aparelho assinam; o serviço confere e executa.">
  <title>Double Check</title>
  <!-- Instalável ("adicionar à tela inicial"): manifesto e ícones em public/icons (gerados por scripts/icones.ts). -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Double Check">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Fontes servidas daqui (public/fonts): nada sai para o Google. Preload só do subset latin, que toda tela usa. -->
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="max-width:430px;margin:48px auto;padding:0 20px;font:15px/1.5 system-ui,sans-serif;color:#edeef0">
      <p lang="pt-BR">O Double Check precisa de JavaScript: é no seu navegador que a transação é conferida e a biometria assina.</p>
      <p lang="en">Double Check needs JavaScript: the transaction is checked and signed with biometrics in your browser.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
